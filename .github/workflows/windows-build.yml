name: ViceKey Windows build and release

on:
  workflow_dispatch:
  push:
    branches: [feature/three-tab-controls]
    paths:
      - 'scripts/**'
      - 'profiles/**'
      - 'build-vickey.ps1'
      - 'build-vickey.sh'
      - '.github/workflows/windows-build.yml'

concurrency:
  group: vickey-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ViceKey
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            diffutils
            make
            unzip
            zip
            pactoys

      - name: Build ViceKey
        shell: pwsh
        run: ./build-vickey.ps1

      - name: Check that this is still the latest branch commit
        id: latest
        shell: pwsh
        run: |
          $latest = (git ls-remote origin refs/heads/feature/three-tab-controls).Split()[0]
          "is_latest=$($latest -eq $env:GITHUB_SHA)" >> $env:GITHUB_OUTPUT

      - name: Publish Windows ZIP to GitHub Releases
        if: steps.latest.outputs.is_latest == 'True'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.0-preview.14
          name: ViceKey 0.1.0 Preview 14 — Windows
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: "Adds color-coded keyboard keycaps in the F1 overlay for every mapped DualSense action, in addition to drag reset, crouch, cover, L1, and contextual map controls."
          generate_release_notes: true
          files: out/ViceKey-Windows.zip
          fail_on_unmatched_files: true
