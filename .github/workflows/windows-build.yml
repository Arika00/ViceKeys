name: ViceKey Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, feature/three-tab-controls]
    paths:
      - 'scripts/**'
      - 'profiles/**'
      - 'build-vickey.ps1'
      - 'build-vickey.sh'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ViceKey
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            diffutils
            make
            unzip
            zip
            pactoys

      - name: Build ViceKey
        shell: pwsh
        run: ./build-vickey.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ViceKey-Windows
          path: out/ViceKey-Windows.zip
          if-no-files-found: error
          retention-days: 14