name: ViceKey Windows build and release

on:
  workflow_dispatch:
  push:
    branches: [feature/three-tab-controls]
    paths:
      - 'scripts/**'
      - 'profiles/**'
      - 'build-vickey.ps1'
      - 'build-vickey.sh'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ViceKey
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            diffutils
            make
            unzip
            zip
            pactoys

      - name: Build ViceKey
        shell: pwsh
        run: ./build-vickey.ps1

      - name: Publish Windows ZIP to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview.1
          name: ViceKey 0.1.0 Preview 1 — Windows
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: out/ViceKey-Windows.zip
          fail_on_unmatched_files: true
