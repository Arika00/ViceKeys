name: Publish ViceKey release status

on:
  workflow_dispatch:
  push:
    branches: [feature/three-tab-controls]
    paths:
      - '.github/workflows/release-status.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Convert preview tag to a normal Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0-preview.4 --prerelease=false --latest --repo Arika00/ViceKeys
